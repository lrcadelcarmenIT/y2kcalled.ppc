<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exhibit Halls · 2020s · The 2000s Called</title>
<meta name="description" content="Philippine pop culture exhibits, 2000 to 2010.">
<link rel="stylesheet" href="museum.css?v=simple1">
<style>
.ex-list{max-width:760px;margin:0 auto;padding:24px 16px 60px;display:flex;flex-direction:column;gap:28px}
.ex-card{background:#fff;border:2px solid #141c2e;border-radius:14px;overflow:hidden}
.ex-card .ex-photo{width:100%;max-height:320px;object-fit:cover;display:block;background:#0e1a2e}
.ex-card .ex-body{padding:20px 22px}
.ex-card .ex-year{font-family:'Space Mono',monospace;font-weight:700;color:#8a6d3b;letter-spacing:.12em;font-size:.8rem;margin:0 0 4px}
.ex-card h2{margin:0 0 10px;font-size:1.45rem}
.ex-card .ex-text{color:#2b3547;margin:0 0 12px;line-height:1.6}
.ex-card .ex-tn{background:#f6f1e5;border-left:4px solid #c9a227;padding:10px 14px;border-radius:0 8px 8px 0;margin:0 0 12px;font-size:.92rem}
.ex-card .ex-src{font-size:.82rem;color:#5a6577;margin:0 0 14px}
.ex-card .ex-src a{color:#1a56db}
.ex-play{width:100%;background:#f4c65b;border:none;border-radius:10px;padding:14px;font-weight:800;font-size:1rem;cursor:pointer;color:#141c2e}
.ex-play:hover{background:#ffd97a}
.ex-play.done{background:#3fae6b;color:#fff}
.ex-game{margin-top:14px;background:#0e1a2e;border-radius:10px;padding:16px;color:#eaf3f0}
.ex-game h4{color:#f4c65b;margin:0 0 8px}
.ex-game .mini-msg{color:#b9c8ca}
.ex-stamp{float:right;font-size:1.4rem}
@media(max-width:640px){.ex-card .ex-body{padding:16px}.ex-card h2{font-size:1.2rem}}
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<canvas id="confetti-canvas" aria-hidden="true"></canvas>
<header class="mast"><div class="shell mast-row">
  <a class="mark" href="index.html">THE 2000s <b>CALLED.</b></a>
  <nav aria-label="Main navigation">
    <a href="index.html">Lobby</a>
    <a href="exhibits.html">2000s Halls</a><a href="exhibits20.html" aria-current="page">2020s Halls</a>
    <a href="play.html">Arcade &amp; Playground</a>
    <a href="guestbook.html">Guestbook</a>
    <a href="walk.html">Grand Hall</a>
    <span class="badge off" id="stamp-badge"><span class="dot"></span>STAMPS <b id="stamp-count">0/6</b></span>
  </nav>
</div></header>
<main>
<div class="ex-list" id="ex-list"></div>
</main>
<footer class="foot"><div class="foot-grid"><div>
<strong>The 2000s Called</strong>
<p>A student virtual museum by Group 9.</p>
</div></div></footer>
<button type="button" id="to-top" aria-label="Back to top">↑</button>
<script>window.MUSEUM_DECADE="2020s";</script>
<script src="museum.js?v=simple1"></script>
<script src="wing2020s.js?v=newwings1"></script>
<script>
(function(){
const list=document.getElementById('ex-list');
const EX=window.EXHIBITS20||{}, MED=window.MEDIA20||{};
const ids=Object.keys(EX).sort((a,b)=>parseInt(EX[a].year)-parseInt(EX[b].year));
ids.forEach(id=>{
  const d=EX[id], m=MED[id];
  const card=document.createElement('article');
  card.className='ex-card';card.id='exhibit-'+id;
  let html='<span class="ex-stamp" data-stamp="'+id+'">'+(hasStamp(id)?'🎫':'')+'</span>';
  html+='<p class="ex-year">'+d.year+'</p><h2>'+d.title+'</h2>';
  if(m&&m.src)html+='<img class="ex-photo" src="'+m.src+'" alt="'+(m.alt||d.title)+'" loading="lazy">';
  html+='<div class="ex-body">';
  html+='<p class="ex-text">'+d.body+'</p>';
  if(d.then||d.now)html+='<div class="ex-tn"><b>Then:</b> '+(d.then||'')+'<br><b>Now:</b> '+(d.now||'')+'</div>';
  if(d.sources&&d.sources.length)html+='<p class="ex-src">Source: '+d.sources.map(s=>'<a href="'+s[1]+'" target="_blank" rel="noopener">'+s[0]+'</a>').join(' · ')+'</p>';
  html+='<button class="ex-play'+(hasStamp(id)?' done':'')+'" data-game="'+id+'">'+(hasStamp(id)?'✓ Stamped — play again':'▶ Play the mini-game')+'</button>';
  html+='<div class="ex-game" hidden></div>';
  html+='</div>';
  card.innerHTML=html;
  list.appendChild(card);
});
list.addEventListener('click',function(e){
  const btn=e.target.closest('.ex-play');
  if(!btn)return;
  const id=btn.dataset.game, d=EX[id];
  const box=btn.parentElement.querySelector('.ex-game');
  const G=Object.assign({},window.GAMESALL||{},window.GAMES20||{}), gf=G[d.game];
  if(typeof gf!=='function'){box.hidden=false;box.innerHTML='<p>Game unavailable.</p>';return;}
  const spec=gf();
  box.hidden=false;
  box.innerHTML='<h4>'+spec.title+'</h4><p class="mini-msg">'+spec.intro+'</p><div class="mini-stage"></div><p class="mini-msg" data-res style="font-weight:700;min-height:1.5em"></p>';
  const stageEl=box.querySelector('.mini-stage'), res=box.querySelector('[data-res]');
  let cleanup=null;
  try{
    spec.render(stageEl,{
      win:function(m){if(cleanup)cleanup();res.textContent=m;awardStamp(id);btn.classList.add('done');btn.innerHTML='✓ Stamped — play again';const st=document.querySelector('[data-stamp="'+id+'"]');if(st)st.textContent='🎫';updateStampUI();},
      lose:function(m){if(cleanup)cleanup();res.textContent=m;}
    },function(fn){cleanup=fn;});
  }catch(err){box.innerHTML='<p>Game failed to start.</p>';}
});
})();
</script>
</body>
</html>
